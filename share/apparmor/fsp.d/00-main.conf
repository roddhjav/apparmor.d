# Full system policy: set the AppArmor profile of systemd services.
#
# In full system policy, aa-install writes a systemd drop-in in
# /etc/systemd/system/<unit>.service.d/apparmor.conf for each service listed
# here. It sets the AppArmorProfile= of the service, so the service starts
# directly in its profile, or stacked with the systemd profile when the
# profile name starts with '&'.
#
# An entry in a later file overrides the same unit in an earlier one. The
# drop-ins are removed when the full system policy is disabled or on uninstall.
#
# File format: one service by line using the format: '<unit> <profile>'
# The unit is the service name, with or without the '.service' suffix.

apport-coredump-hook@ &apport
apt-news &apt_news
archlinux-keyring-wkd-sync &archlinux-keyring-wkd-sync
bluetooth &bluetoothd
cloud-init-hotplugd &cloud-init-hotplugd.service
colord &colord
dbus-org.freedesktop.hostname1 &systemd-hostnamed
dbus-org.freedesktop.import1 &systemd-importd
dbus-org.freedesktop.locale1 &systemd-localed
dbus-org.freedesktop.login1 &systemd-logind
dbus-org.freedesktop.machine1 &systemd-machined
dbus-org.freedesktop.timedate1 &systemd-timedated
debug-shell debug-shell.service
dmesg dmesg.service
e2scrub@ &e2scrub
e2scrub_reap &e2scrub_all
fprintd &fprintd
fwupd &fwupd
fwupd-refresh &fwupdmgr
geoclue &geoclue
grub-common grub-common.service
irqbalance &irqbalance
ldconfig ldconfig.service
logrotate &logrotate
man-db man-db.service
ModemManager &ModemManager
nm-priv-helper &nm-priv-helper
pcscd &pcscd
polkit &polkitd
power-profiles-daemon &power-profiles-daemon
rngd &rngd
rsyslog &rsyslogd
secureboot-db secureboot-db.service
shadow &shadow.service
snapd.system-shutdown snapd.system-shutdown.service
systemd-coredump@ &systemd-coredump
systemd-homed &systemd-homed
systemd-hostnamed &systemd-hostnamed
systemd-initctl &systemd-initctl
systemd-journald &systemd-journald
systemd-journald@ &systemd-journald
systemd-journal-remote &systemd-journal-remote
systemd-localed &systemd-localed
systemd-logind &systemd-logind
systemd-machined &systemd-machined
systemd-networkd &systemd-networkd
systemd-nsresourced &systemd-nsresourced
systemd-oomd &systemd-oomd
systemd-resolved &systemd-resolved
systemd-rfkill &systemd-rfkill
systemd-timedated &systemd-timedated
systemd-timesyncd &systemd-timesyncd
systemd-userdbd &systemd-userdbd
system-update-cleanup system-update-cleanup.service
upower &upowerd
usb_modeswitch@ usb_modeswitch.service
