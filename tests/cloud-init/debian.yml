  # KDE packages for Debian
  - spice-vdagent
  - task-kde-desktop
  - plasma-workspace-wayland
  - terminator

desktop-runcmd: &desktop-runcmd
  # Enable auditd systemd socket
  - systemctl enable systemd-journald-audit.socket

  # Install the default kernel and remove the cloud one
  - |
    export DEBIAN_FRONTEND=noninteractive
    apt install -y linux-image-amd64 linux-headers-amd64
    echo "linux-image-$(uname -r) linux-image-$(uname -r)/prerm/removing-running-kernel boolean false" | debconf-set-selections
    apt remove -y --purge linux-image-$(uname -r)
    apt autoremove -y --purge
    update-grub

# Debian experimental repository, for the development version of apparmor
apt-experimental: &apt-experimental
  path: /etc/apt/sources.list.d/experimental.sources
  permissions: "0644"
  content: |
    Types: deb
    URIs: http://deb.debian.org/debian
    Suites: experimental
    Components: main
    Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

# Only get the apparmor packages from experimental
pin-experimental: &pin-experimental
  path: /etc/apt/preferences.d/experimental
  permissions: "0644"
  content: |
    Package: *apparmor*
    Pin: release a=experimental
    Pin-Priority: 990
