#cloud-config

packages: *kde-packages

# apparmor.debug=1
runcmd:
  # Replace SELinux by AppArmor in kernel parameters
  - sed -i 's/security=selinux selinux=1/apparmor=1/g' /etc/default/grub

  # Regenerate grub.cfg
  - grub2-mkconfig -o /boot/grub2/grub.cfg

  # Enable de display manager
  - systemctl set-default graphical.target

  # Install the desktop fresh with --recommends
  - zypper -n install --recommends -t pattern kde_plasma kde

write_files:
  - *shared-directory          # Setup shared directory
  - *disable-printk-ratelimit  # Disable printk rate limiting

  - path: /etc/sysconfig/displaymanager
    append: true
    content: |
      DISPLAYMANAGER="sddm"
