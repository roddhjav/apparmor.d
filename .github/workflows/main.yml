name: Ubuntu

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install linter dependencies
        run: |
          pipx install rust-just
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run basic profile linter check
        run: |
          just check

  build:
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            mode: default
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install Build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            devscripts debhelper \
            auditd apparmor-profiles apparmor-utils
          pipx install rust-just
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo rm -f /etc/apparmor.d/usr.lib.snapd.snap-confine.real

      - name: Build the apparmor.d package
        run: |
          just build-dpkg

      - name: Configure aa-install
        run: |
          sudo mkdir -p /etc/apparmor
          sudo tee /etc/apparmor/modes > /dev/null <<EOF
          default complain
          include default
          reload no
          EOF

      - name: Install apparmor.d
        run: |
            sudo dpkg --install .pkg/apparmor.d*.deb
            sudo aa-install --install --all

      - name: Show the installation status
        run: sudo aa-install --status

      - name: Reload AppArmor
        run: |
            if ! sudo systemctl restart apparmor.service; then
              sudo journalctl -xeu apparmor.service
              exit 1
            fi

      - name: Show AppArmor log and rules
        run: |
          sudo aa-log
          sudo aa-log -s
          sudo aa-log -r

      - name: Show Number of loaded profile
        run: sudo aa-status --profiled

      - name: Cache the build packages
        if: matrix.mode == 'default' && matrix.os == 'ubuntu-26.04'
        uses: actions/cache/save@v6
        with:
          path: .pkg/apparmor.d*.deb
          key: ${{ matrix.os }}-${{ matrix.mode }}-${{ hashFiles('.pkg/apparmor.d*.deb') }}

  tests:
    runs-on: ubuntu-26.04
    needs: build
    if: github.ref_name == 'dev' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Restore the cached build packages
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          path: .pkg/apparmor.d*.deb
          key: ubuntu-26.04-default-${{ hashFiles('.pkg/apparmor.d*.deb') }}
          restore-keys: |
            ubuntu-26.04-default-

      - name: Install Tests dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            apparmor-profiles apparmor-utils \
            bats bats-support
          pipx install rust-just
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure aa-install
        run: |
          sudo mkdir -p /etc/apparmor
          sudo tee /etc/apparmor/modes > /dev/null <<EOF
          default complain
          include default
          reload no
          EOF

      - name: Install apparmor.d
        run: |
          sudo dpkg --install .pkg/apparmor.d*.deb
          sudo aa-install --install --all
          sudo systemctl restart apparmor.service
          sudo systemctl daemon-reload
          systemctl --user daemon-reload

      - name: Restart some services to ensure they are confined
        run: |
          services=(
            containerd cron
            dbus docker
            ModemManager multipathd
            networkd-dispatcher
            packagekit polkit
            snapd
            systemd-journald systemd-hostnamed systemd-logind systemd-networkd
            systemd-resolved systemd-udevd
            udisks2
          )
          sudo systemctl daemon-reload
          for service in "${services[@]}"; do
            sudo systemctl restart "$service" || systemctl status "$service.service" || true
          done
          systemctl restart --user dbus || systemctl status --user "dbus.service" || true
          sudo ps auxZ | grep -v '\[.*\]'
          sudo aa-log -s --raw

      - name: Install integration dependencies
        run: |
          just init
          find /usr/sbin/ -type f

      - name: Run the integration tests
        run: |
          just integration

      - name: Show final AppArmor logs
        if: always()
        run: |
          sudo aa-log -s --raw

      - name: Show final processes security context
        if: always()
        run: |
          sudo ps auxZ | grep -v '\[.*\]'
